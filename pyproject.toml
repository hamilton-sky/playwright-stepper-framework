[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "playwright-stepper-framework"
version = "0.1.0"
requires-python = ">=3.10"
# The floor the engine imports at startup. requirements.txt pins exact versions
# for CI and the Claude Code web image; these are the ranges `pip install .`
# resolves against, so an installed `stepper` can at least start.
dependencies = [
    "playwright>=1.56",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# visual_compare diffs screenshots with numpy + Pillow; without them it cannot
# run, and its unit tests cannot be collected.
visual   = ["numpy>=2.0", "Pillow>=10.0"]
# Phase 2 of the resolver cascade embeds with MiniLM.
semantic = ["sentence-transformers>=3.0"]
# Phase 3 (AI pick) and the planner. Each provider is optional at runtime.
ai       = ["anthropic>=0.86", "openai>=2.0", "groq>=1.0", "google-generativeai>=0.8"]
test     = ["pytest>=9.0", "pytest-asyncio>=1.3", "allure-pytest>=2.15"]
all      = ["playwright-stepper-framework[visual,semantic,ai,test]"]

[project.scripts]
stepper = "stepper.main:main"

[tool.setuptools.packages.find]
# One root. Everything the engine ships is under the `stepper` namespace; `poms`
# stays top-level because it is a peer of the engine rather than a child of it
# (see stepper/__init__.py).
#
# This used to be `where = [".", "stepper"]` with `engine*`, `bootstrap*` and
# `sites*` in the include list, which installed three of the most collision-prone
# names on PyPI straight into site-packages.
where = ["."]
include = ["poms*", "stepper*"]
exclude = ["stepper.tests*"]

[tool.setuptools.package-data]
# Workflows and site config are data, not code — without this a wheel ships the
# actions but not a single workflow to run with them.
"*" = ["workflows/*.json", "config/*.yaml", "data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
log_cli = true
log_cli_level = "INFO"
addopts = "-s --alluredir=reports/allure-results"
