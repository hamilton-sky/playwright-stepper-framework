name: CI

on:
  push:
    branches: [main, "hamilton/**"]
  pull_request:
    branches: [main]

jobs:
  # ── Fast gate: unit tests (no browser, no network) ────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest stepper/tests/unit/ -v --junitxml=reports/junit-unit.xml
        env:
          PYTHONPATH: stepper

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit
          path: reports/junit-unit.xml

  # ── Integration tests (real browser, headless) ────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    # Declared once for the whole job. These were previously repeated per step,
    # which is how OPENLIBRARY_USERNAME / OPENLIBRARY_PASSWORD came to be missing
    # from every one of them — the OpenLibrary steps could never authenticate.
    env:
      PYTHONPATH: stepper
      OPENLIBRARY_USERNAME: ${{ secrets.OPENLIBRARY_USERNAME }}
      OPENLIBRARY_PASSWORD: ${{ secrets.OPENLIBRARY_PASSWORD }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Download MiniLM model
        run: python stepper/download_models.py

      # Reads the values from the job env rather than interpolating ${{ secrets.* }}
      # into the shell, so nothing secret is ever expanded into a command line.
      - name: Detect OpenLibrary credentials
        id: creds
        run: |
          if [ -n "$OPENLIBRARY_USERNAME" ] && [ -n "$OPENLIBRARY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=OpenLibrary steps skipped::OPENLIBRARY_USERNAME / OPENLIBRARY_PASSWORD are not configured, so the OpenLibrary smoke workflow and integration tests did not run. Set them in Settings → Secrets and variables → Actions."
            {
              echo "### ⚠ OpenLibrary steps skipped"
              echo
              echo "\`OPENLIBRARY_USERNAME\` / \`OPENLIBRARY_PASSWORD\` are not configured for this repository,"
              echo "so the OpenLibrary smoke workflow and the integration test suite were skipped."
              echo "SauceDemo coverage still ran."
              echo
              echo "Set them in **Settings → Secrets and variables → Actions** to enable them."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run smoke workflow (OpenLibrary)
        if: steps.creds.outputs.available == 'true'
        run: >
          python stepper/main.py
          --workflow stepper/sites/openlibrary/workflows/ol_smoke_test.json
          --ci
          --ci-output reports/ci-ol-smoke.json

      - name: Run smoke workflow (SauceDemo)
        run: >
          python stepper/main.py
          --workflow stepper/sites/saucedemo/workflows/sd_smoke_test.json
          --ci
          --ci-output reports/ci-sd-smoke.json

      # Every test under stepper/tests/ (excluding unit/) drives an OpenLibrary
      # workflow, so the whole step depends on the credentials.
      - name: Run stepper integration tests
        if: steps.creds.outputs.available == 'true'
        run: pytest stepper/tests/ --ignore=stepper/tests/unit -v --junitxml=reports/junit-integration.xml

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-integration
          path: reports/junit-integration.xml

      - name: Upload CI summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summaries
          path: reports/ci-*.json
